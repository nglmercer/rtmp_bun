<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Player HLS</title>
    <style>
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 80%; max-width: 1000px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <video id="video" controls autoplay muted></video>

    <script>
        var video = document.getElementById('video');
        
        // ---------------------------------------------------------
        var videoSrc = 'http://localhost:3000/live/default/index.m3u8';
        // ---------------------------------------------------------
        //var videoSrc = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'; // URL de prueba pública

        // 3. Lógica de carga
        if (Hls.isSupported()) {
            console.log("HLS.js soportado. Iniciando...");
            var hls = new Hls({
                debug: false, // Activa logs en la consola (F12) para ver errores
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
            // Manejo básico de errores
            hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("Error HLS:", data);
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback para Safari (Soporte nativo)
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
