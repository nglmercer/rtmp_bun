<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Player HLS</title>
    <style>
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 80%; max-width: 1000px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <video id="video" controls autoplay muted></video>

    <script>
        var video = document.getElementById('video');
        
        // ---------------------------------------------------------
        var videoSrc = 'http://localhost:3000/live/default/playlist.m3u8';
        // ---------------------------------------------------------
        //var videoSrc = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'; // URL de prueba pública

        // 3. Lógica de carga
        if (Hls.isSupported()) {
            console.log("HLS.js soportado. Iniciando...");
            var hls = new Hls({
                debug: true, // Activar logs para depuración
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });
            
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MEDIA_ATTACHED, function() {
                console.log("Media adjuntado al reproductor");
            });
            
            hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                console.log("Playlist parseada, niveles disponibles:", data.levels);
                console.log("Iniciando reproducción...");
                video.play().catch(e => console.error("Error al iniciar reproducción:", e));
            });
            
            hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                console.log("Nivel cargado:", data.level, "fragmentos:", data.details.fragments.length);
            });
            
            hls.on(Hls.Events.FRAG_LOADED, function(event, data) {
                console.log("Fragmento cargado:", data.frag.url);
            });
            
            // Manejo detallado de errores
            hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("Error HLS:", data);
                console.error("Tipo:", data.type, "Detalles:", data.details);
                
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error("Error de red - reintentando...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error("Error de medios - recuperando...");
                            hls.recoverMediaError();
                            break;
                        default:
                            console.error("Error fatal - no se puede recuperar");
                            break;
                    }
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback para Safari (Soporte nativo)
            console.log("Usando soporte nativo de Safari");
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                console.log("Metadata cargada, iniciando reproducción");
                video.play().catch(e => console.error("Error al iniciar reproducción:", e));
            });
        } else {
            console.error("HLS no soportado en este navegador");
        }
    </script>
</body>
</html>
