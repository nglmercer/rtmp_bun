<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Player HLS</title>
    <style>
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 80%; max-width: 1000px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <video id="video" controls autoplay muted></video>

    <script>
        var video = document.getElementById('video');
        
        // ---------------------------------------------------------
        // CAMBIA ESTO POR TU URL LOCAL CUANDO TENGAS EL SERVIDOR:/hls-memory/playlist.m3u8
        var videoSrc = 'http://localhost:3000/hls-memory/playlist.m3u8';
        // ---------------------------------------------------------
        //var videoSrc = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'; // URL de prueba pública
        const status = fetch('http://localhost:3000/hls/status')

        // 3. Lógica de carga
        if (Hls.isSupported()) {
            console.log("HLS.js soportado. Iniciando...");
            var hls = new Hls({
                debug: true, // Activa logs en la consola (F12) para ver errores
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            console.log("Hls.Events.MANIFEST_PARSED",Hls.Events.MANIFEST_PARSED)
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
            // Manejo básico de errores
            hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("Error HLS:", data);
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback para Safari (Soporte nativo)
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        // Script para probar la API HLS en memoria
        const baseURL = 'http://localhost:3000';

        async function testAPI() {
            console.log('🧪 Iniciando pruebas de API HLS...\n');
            
            try {
                // 1. Verificar estado inicial
                console.log('1️⃣ Verificando estado inicial...');
                const statusResponse = await fetch(`${baseURL}/api/hls-memory/status`);
                const status = await statusResponse.json();
                console.log('Estado inicial:', JSON.stringify(status, null, 2));
                
                // 2. Iniciar HLS (o verificar si ya está corriendo)
                console.log('\n2️⃣ Iniciando HLS...');
                try {
                    // Primero verificar si ya está corriendo
                    const statusCheck = await fetch(`${baseURL}/api/hls-memory/status`);
                    const statusData = await statusCheck.json();
                    
                    if (statusData.success && statusData.data.isRunning) {
                        console.log('ℹ️ HLS ya está corriendo, deteniendo primero...');
                        await fetch(`${baseURL}/api/hls-memory/stop`, { method: 'POST' });
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Esperar 1 segundo
                    }
                    
                    const startResponse = await fetch(`${baseURL}/api/hls-memory/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ streamKey: 'test123' })
                    });
                    
                    console.log('Response status:', startResponse.status);
                    const startResult = await startResponse.json();
                    console.log('Resultado inicio:', JSON.stringify(startResult, null, 2));
                    
                    if (!startResponse.ok) {
                        console.log('⚠️ HLS ya estaba corriendo o no se pudo iniciar:', startResult.message);
                    }
                } catch (error) {
                    console.log('⚠️ Error al iniciar HLS (puede que ya esté corriendo):', error.message);
                }
                
                // 3. Esperar un momento y verificar estado
                console.log('\n3️⃣ Esperando 3 segundos...');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                console.log('4️⃣ Verificando estado después de iniciar...');
                const statusAfterStart = await fetch(`${baseURL}/api/hls-memory/status`);
                const status2 = await statusAfterStart.json();
                console.log('Estado después de iniciar:', JSON.stringify(status2, null, 2));
                
                // 5. Intentar cargar playlist
                console.log('\n5️⃣ Intentando cargar playlist...');
                const playlistResponse = await fetch(`${baseURL}/hls-memory/playlist.m3u8`);
                console.log('Playlist response status:', playlistResponse.status);
                
                if (playlistResponse.ok) {
                    const playlistText = await playlistResponse.text();
                    console.log('Playlist content (primeras líneas):');
                    console.log(playlistText.split('\n').slice(0, 10).join('\n'));
                } else {
                    console.log('Error cargando playlist:', await playlistResponse.text());
                }
                
                // 6. Verificar archivos de debug
                console.log('\n6️⃣ Verificando archivos en memoria...');
                const debugResponse = await fetch(`${baseURL}/debug/files`);
                if (debugResponse.ok) {
                    const debugFiles = await debugResponse.json();
                    console.log('Archivos en memoria:', JSON.stringify(debugFiles, null, 2));
                }
                
                // 7. Detener HLS
                console.log('\n7️⃣ Deteniendo HLS...');
                const stopResponse = await fetch(`${baseURL}/api/hls-memory/stop`, {
                    method: 'POST'
                });
                const stopResult = await stopResponse.json();
                console.log('Resultado detener:', JSON.stringify(stopResult, null, 2));
                
                console.log('\n✅ Pruebas completadas!');
                
            } catch (error) {
                console.error('\n❌ Error en las pruebas:', error.message);
                console.error('Stack:', error.stack);
            }
        }

        // Ejecutar pruebas
        testAPI();

    </script>
</body>
</html>
