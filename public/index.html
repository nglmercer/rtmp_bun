<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor RTMP - Enhanced (HEVC/AV1)</title>
    <style>
        body {
            background: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }
        video {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            object-fit: contain;
        }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
        }
        #status.error { color: #f00; }
        #status.waiting { color: #ff0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
</head>
<body>

    <div id="status">Iniciando motor MPEGTS...</div>
    <video id="videoElement" controls autoplay muted></video>

    <script>
        const STREAM_URL = 'http://localhost:3000/live/default.flv';
        const videoElement = document.getElementById('videoElement');
        const statusElement = document.getElementById('status');
        let player = null;
        let retryTimer = null;

        function showStatus(msg, type = 'normal') {
            statusElement.innerText = `📡 ${msg}`;
            statusElement.className = type;
        }

        function initPlayer() {
            // 1. Verificación de soporte mejorada
            if (!mpegts.getFeatureList().mseLivePlayback) {
                showStatus('Tu navegador no soporta MSE Live', 'error');
                return;
            }

            if (player) {
                destroyPlayer();
            }

            showStatus('Conectando...', 'waiting');

            // 2. Creación del player usando mpegts
            player = mpegts.createPlayer({
                type: 'flv',  // mpegts maneja flv sobre http igual que flv.js
                url: STREAM_URL,
                isLive: true,
                hasAudio: true,
                hasVideo: true,
                cors: true
            }, {
                // Configuración de Ultra Baja Latencia
                enableStashBuffer: false,
                liveBufferLatencyChasing: true, // Característica específica de mpegts
                liveBufferLatencyMaxLatency: 1.2, // Intentar mantener 1.2s máximo
                liveBufferLatencyMinRemain: 0.3,
                lazyLoad: false,
                autoCleanupSourceBuffer: true
            });

            player.attachMediaElement(videoElement);

            // Eventos (La API es idéntica a flv.js)
            player.on(mpegts.Events.LOADING_COMPLETE, () => {
                showStatus('Stream terminado (reiniciando...)', 'waiting');
                retryConnection();
            });

            player.on(mpegts.Events.ERROR, (errType, errDetail) => {
                console.log('Error Player:', errType, errDetail);
                if (errType === mpegts.ErrorTypes.NETWORK_ERROR) {
                    showStatus('Esperando Stream...', 'waiting');
                    retryConnection();
                } else if (errType === mpegts.ErrorTypes.MEDIA_ERROR) {
                     // Si falla la decodificación (ej. codec no soportado por hardware)
                     if(errDetail.includes('CodecUnsupported')) {
                        showStatus('Error: Codec no soportado por HW', 'error');
                     } else {
                        retryConnection();
                    }
                }
            });

            player.on(mpegts.Events.MEDIA_INFO, () => {
                showStatus('EN VIVO (Enhanced)', 'normal');
            });

            try {
                player.load();
                player.play().catch(e => {
                    console.warn("Autoplay bloqueado:", e);
                    showStatus('Click para reproducir', 'waiting');
                });
            } catch (e) {
                retryConnection();
            }
        }

        function destroyPlayer() {
            if (player) {
                player.pause();
                player.unload();
                player.detachMediaElement();
                player.destroy();
                player = null;
            }
        }

        function retryConnection() {
            if (retryTimer) clearTimeout(retryTimer);
            destroyPlayer();
            retryTimer = setTimeout(() => {
                console.log("Reintentando conexión...");
                initPlayer();
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', initPlayer);

    </script>
</body>
</html>
